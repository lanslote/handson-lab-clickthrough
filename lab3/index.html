<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Lab 3 · 수강생 입장</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="../lab2/lab-data.js"></script>
<script type="module" src="app.js"></script>
</head>
<body data-page-role="student">
<header class="top">
  <b>Lab 3</b>
  <div id="student-identity" hidden><span id="class-title"></span><span id="role"></span></div>
  <details id="learner-menu">
    <summary>메뉴</summary>
    <div class="menu-panel">
      <div id="learner-options" hidden>
        <label>입장한 구간 다시 보기<select id="review"></select></label>
        <button id="current" type="button">현재 진도로 돌아가기</button>
        <label class="video-option"><input id="force-video" type="checkbox" checked> 영상 매번 보기</label>
        <p class="muted">켜 두면 이미 본 영상도 끝까지 시청합니다.</p>
        <button id="leave" type="button">수업에서 나가기</button>
      </div>
      <button id="theme" type="button">◐ 테마</button>
      <a href="../">소개</a><a href="instructor.html">강사 화면 →</a>
    </div>
  </details>
</header>
<div id="connection" role="status" aria-live="polite">서버 설정 확인 중…</div>
<div id="message" role="alert" hidden></div>
<main class="student-main">
  <section id="entry" class="entry">
      <form id="join" class="card">
        <h1>수업 입장</h1>
        <label>오픈된 수업<select id="class-select" name="code" required disabled><option value="">수업 목록을 불러오는 중…</option></select></label>
        <p id="classes-status" class="muted" role="status" aria-live="polite">강사가 오픈한 수업만 표시합니다.</p>
        <button id="classes-retry" type="button" hidden>목록 다시 불러오기</button>
        <label>닉네임<input name="nickname" required maxlength="24" autocomplete="nickname"></label>
        <button class="primary" type="submit" disabled>수업 입장</button>
      </form>
  </section>
  <section id="resume" class="card" hidden>
    <h1>이전 진도를 이어갈까요?</h1>
    <p id="resume-status"></p>
    <p class="muted">처음부터 하면 내 완료 기록을 초기화합니다.</p>
    <div class="resume-actions"><button id="continue" type="button" class="primary" disabled>이어서 하기</button><button id="restart" type="button" disabled>처음부터 하기</button></div>
  </section>
  <section id="classroom" hidden>
    <div class="student-status-bar">
      <div id="learner-status" role="status" aria-live="polite"></div>
      <button id="next-portion" type="button" class="primary" hidden></button>
    </div>
    <div id="learner">
      <div id="activity-error" role="alert" hidden></div>
      <section id="pre-start" class="ready-screen" aria-labelledby="ready-title" hidden>
        <div>
          <span class="kicker">입장 완료</span>
          <h2 id="ready-title">수업에 입장했습니다</h2>
          <p id="ready-guidance">강사가 3-1을 열면 실습을 시작할 수 있습니다.</p>
          <ul><li>에이전트 만들기</li><li>지식 소스 연결하기</li><li>응답과 근거 확인하기</li></ul>
        </div>
        <figure>
          <img src="../lab2/shots/s01-home.png" alt="실습에서 따라 할 Copilot Studio 첫 화면 미리 보기" width="1280" height="800">
          <figcaption class="muted">실습 화면 미리 보기</figcaption>
        </figure>
      </section>
      <iframe id="activity" title="Copilot Studio 클릭스루 실습" hidden></iframe>
    </div>
  </section>
</main>
<noscript>Lab 3에는 JavaScript와 별도 수업 서버가 필요합니다. 혼자 하는 실습은 Lab 2를 이용하세요.</noscript>
</body>
</html>
